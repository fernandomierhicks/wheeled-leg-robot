; PlatformIO — ODrive CAN characterization sketch
; Target: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3)
; Purpose: Measure ODrive CAN TX throughput, RX frame rate, and pipeline latency.

[env:usb_can]
platform       = renesas-ra
board          = uno_r4_wifi
framework      = arduino
monitor_speed  = 1000000
; Arduino_CAN is built into the Renesas framework — no lib_dep needed.
; No other external libs required for this minimal sketch.
