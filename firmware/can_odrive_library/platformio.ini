; ODriveArduino CAN proof-of-concept — Arduino UNO R4 WiFi + ODrive 3.6-56
; Spins two motors via CAN using the ODriveArduino library.

[env:uno_r4_wifi]
platform     = renesas-ra
board        = uno_r4_wifi
framework    = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/odriverobotics/ODriveArduino.git
