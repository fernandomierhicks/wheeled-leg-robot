[platformio]
default_envs = teensy41

[env:teensy41]
platform         = teensy
board            = teensy41
framework        = arduino
upload_protocol  = teensy-cli
board_build.usb_type = USB_SERIAL
build_flags      = -I"../shared" -Isrc
build_src_filter = +<*> -<ibus_demo/> -<ak45_uart_demo/> -<rgb_led_demo/> -<buzzer_demo/>
lib_extra_dirs   = ../shared
lib_deps         = adafruit/Adafruit BNO08x
                   jrullan/StateMachine
                   ivanseidel/LinkedList
                   greiman/SdFat

[env:ibus_demo]
extends          = env:teensy41
build_src_filter = -<*> +<ibus_demo/>

[env:ak45_uart_demo]
extends          = env:teensy41
build_src_filter = -<*> +<ak45_uart_demo/>

[env:rgb_led_demo]
extends          = env:teensy41
build_src_filter = -<*> +<rgb_led_demo/>

[env:buzzer_demo]
extends          = env:teensy41
build_src_filter = -<*> +<buzzer_demo/>

[env:test_teensy]
extends          = env:teensy41
build_src_filter = -<src/>
test_filter      = test_*
test_ignore      = test_comm_usb

[env:test_comm_usb]
extends          = env:teensy41
build_src_filter = -<src/>
test_filter      = test_comm_usb
