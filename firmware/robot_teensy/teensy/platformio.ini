[platformio]
default_envs = teensy41

[env:teensy41]
platform         = teensy
board            = teensy41
framework        = arduino
upload_protocol  = teensy-cli
board_build.usb_type = USB_SERIAL
build_flags      = -I"../shared" -Isrc
build_src_filter = +<*> -<ibus_demo/> -<ak45_uart_demo/> -<rgb_led_demo/> -<buzzer_demo/>
lib_extra_dirs   = ../shared
lib_deps         = jrullan/StateMachine
                   ivanseidel/LinkedList
                   greiman/SdFat
                   adafruit/Adafruit BusIO
                   adafruit/Adafruit Unified Sensor

[env:ibus_demo]
extends          = env:teensy41
build_src_filter = -<*> +<ibus_demo/>

[env:ak45_uart_demo]
extends          = env:teensy41
build_src_filter = -<*> +<ak45_uart_demo/>

[env:rgb_led_demo]
extends          = env:teensy41
build_src_filter = -<*> +<rgb_led_demo/>

[env:buzzer_demo]
extends          = env:teensy41
build_src_filter = -<*> +<buzzer_demo/>

[env:test_teensy]
extends          = env:teensy41
build_src_filter = -<src/>
test_filter      = test_*
test_ignore      = test_comm_usb, test_commlink_robustness

# Legacy three-stream architecture retained only for A/B regression testing.
[env:test_imu_legacy]
extends          = env:test_teensy
test_filter      = test_imu
build_flags      = ${env:teensy41.build_flags}
                   -DIMU_USE_GYRO_INTEGRATED_RV=0
                   -DIMU_REQUIRED_RATE_HZ=160
                   -DIMU_ENABLE_LINEAR_ACCEL=1

# Dedicated low-latency quaternion+angular-velocity report with acceleration
# retained for characterization only.
[env:test_imu_integrated]
extends          = env:test_teensy
test_filter      = test_imu
build_flags      = ${env:teensy41.build_flags}
                   -DIMU_USE_GYRO_INTEGRATED_RV=1
                   -DIMU_REQUIRED_RATE_HZ=400
                   -DIMU_ENABLE_LINEAR_ACCEL=1

# Candidate architecture: one 400 Hz quaternion+calibrated-gyro report and no
# normal-channel fusion outputs. The longer soak targets intermittent stalls.
[env:test_imu_integrated_only]
extends          = env:test_teensy
test_filter      = test_imu
build_flags      = ${env:teensy41.build_flags}
                   -DIMU_USE_GYRO_INTEGRATED_RV=1
                   -DIMU_REQUIRED_RATE_HZ=400
                   -DIMU_ENABLE_LINEAR_ACCEL=0
                   -DIMU_TEST_SOAK_MS=60000

# Boundary test: this repeatedly starved normal-channel linear acceleration on
# the physical robot, and one run also produced spontaneous recovery cycles.
[env:test_imu_integrated_500]
extends          = env:test_teensy
test_filter      = test_imu
build_flags      = ${env:teensy41.build_flags}
                   -DIMU_USE_GYRO_INTEGRATED_RV=1
                   -DIMU_REQUIRED_RATE_HZ=500
                   -DIMU_ENABLE_LINEAR_ACCEL=1

[env:test_imu_integrated_250]
extends          = env:test_teensy
test_filter      = test_imu
build_flags      = ${env:teensy41.build_flags}
                   -DIMU_USE_GYRO_INTEGRATED_RV=1
                   -DIMU_REQUIRED_RATE_HZ=250
                   -DIMU_ENABLE_LINEAR_ACCEL=1

[env:test_comm_usb]
extends          = env:teensy41
build_src_filter = -<src/>
test_filter      = test_comm_usb

# Native (desktop) CommLink parser robustness test — no hardware, no Arduino
# framework. Possible because CommLink.h has its own native-compatible Stream
# stub (see its #ifndef ARDUINO branch). UARTplat.md Phase 6/§7.2.
[env:native]
platform    = native
build_flags = -std=gnu++14 -I"../shared" -I"../shared/CommLink"
test_filter = test_commlink_robustness

# Windows-native equivalent for developer machines without a system gcc/g++
# installation. PlatformIO supplies the MinGW toolchain, while [env:native]
# remains the fast path on Linux/macOS and CI hosts with a compiler on PATH.
[env:windows_x86]
platform    = windows_x86
build_flags = -std=gnu++14 -fpack-struct=1 -I"../shared" -I"../shared/CommLink"
test_filter = test_commlink_robustness

[env:windows_command_validation]
platform    = windows_x86
build_flags = -std=gnu++14 -fpack-struct=1 -I"../shared"
test_filter = test_command_validation

[env:windows_param_store]
platform    = windows_x86
build_flags = -std=gnu++14 -fpack-struct=1 -I"../shared"
test_filter = test_param_store

[env:windows_control_math]
platform    = windows_x86
build_flags = -std=gnu++14 -Isrc
test_filter = test_control_math
