[platformio]
default_envs = teensy41

[env:teensy41]
platform        = teensy
board           = teensy41
framework       = arduino
upload_protocol = teensy-cli
build_flags     = -I"../shared" -Isrc
lib_extra_dirs  = ../shared
lib_deps        = adafruit/Adafruit BNO08x

[env:test_teensy]
extends          = env:teensy41
build_src_filter = -<src/>
test_filter      = test_*
