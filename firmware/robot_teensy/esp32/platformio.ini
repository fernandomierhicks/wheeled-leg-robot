[platformio]
default_envs = esp32s3

[env:esp32s3]
platform       = espressif32
board          = seeed_xiao_esp32s3
framework      = arduino
build_flags    = -I"../shared"
lib_extra_dirs = ../shared

[env:test_esp32]
extends     = env:esp32s3
src_filter  = -<src/>
test_filter = test_*

[env:native]
platform    = native
build_flags = -I"../shared"
test_filter = test_telemetry
