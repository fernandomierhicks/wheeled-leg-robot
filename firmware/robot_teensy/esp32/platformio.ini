[platformio]
default_envs = esp32dev

[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
build_flags    = -I"../shared" -Isrc
lib_extra_dirs = ../shared

[env:test_esp32]
extends     = env:esp32dev
build_src_filter = -<src/>
test_filter = test_*

[env:native]
platform    = native
build_flags = -I"../shared"
test_filter = test_telemetry
