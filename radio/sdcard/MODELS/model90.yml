    name: "SPARE"

# Logical switches. Channel-based only, on purpose: telemetry sensors do not
# exist until the CRSF telemetry emitter lands in firmware, and a logical
# switch pointed at a sensor that has never been discovered is a switch that
# silently never fires.
#   L1  armed        CH10 above centre
#   L2  jump asked   CH6  above centre
#   L3  estop asked  CH11 above centre
logicalSw:
  0:
    func: FUNC_VPOS
    def: "ch(9),50"
    andsw: "NONE"
    delay: 0
    duration: 0
  1:
    func: FUNC_VPOS
    def: "ch(5),50"
    andsw: "NONE"
    delay: 0
    duration: 0
  2:
    func: FUNC_VPOS
    def: "ch(10),50"
    andsw: "NONE"
    delay: 0
    duration: 0

# Special functions. Annunciation and logging only -- never control. Firmware
# stays authoritative; TX-side logic that tries to disarm would just fight the
# interlocks and produce behaviour nobody can explain afterwards.
#
# The tracks referenced here are the flat copies in /SOUNDS/en/ (6-char names)
# because the Play Track picker cannot reliably reach into /SOUNDS/en/WLR/.
# The Lua HUD uses the WLR/ folder with full paths and is unaffected.
customFn:
  0:
    swtch: "L1"
    func: PLAY_TRACK
    def: "wlrarm,1,1x"
  1:
    swtch: "!L1"
    func: PLAY_TRACK
    def: "wlrdis,1,1x"
  2:
    swtch: "L3"
    func: PLAY_TRACK
    def: "wlrsir,1,1x"
  3:
    swtch: "L3"
    func: HAPTIC
    def: "3,1"
  # Radio-side telemetry log at 1 Hz, started by the same switch that starts
  # the robot's own .wlog. Two independent records with different clocks catch
  # a whole class of "the log lied" bugs -- but only if they start together.
  4:
    swtch: "SBd"
    func: LOGS
    def: "10,1"
  5:
    swtch: "SBd"
    func: PLAY_TRACK
    def: "wlrlog,1,1x"
  6:
    swtch: "!SBd"
    func: PLAY_TRACK
    def: "wlrlgf,1,1x"

timers:
  0:
    start: 0
    swtch: "L1"
    value: 0
    mode: ON
    countdownBeep: 0
    minuteBeep: 1
    persistent: 0
    countdownStart: 0
    showElapsed: 0
    extraHaptic: 0
    name: "ARMED"

flightModeData:
  0:
    name: ""
    swtch: "NONE"
    fadeIn: 0
    fadeOut: 0

# Internal module = the LR1121 ELRS radio, speaking CRSF. Bidirectionality is
# the whole reason for the iBUS -> CRSF swap: it is what makes telemetry and
# an on-radio HUD possible at all.
#
# crsfArmingMode 0 keeps ELRS arming tied to the channel rather than to a
# switch ELRS picks for itself. That matters here: the robot's arm interlock
# lives in firmware on CH10, and a second arming authority inside the radio
# link would be exactly the "two sources of truth" failure this project has
# already decided to avoid. Leave it at 0 unless you have a reason.
#
# failsafeMode NOT_SET means the receiver keeps its own configured failsafe.
# Do not set HOLD here. The firmware's whole safety story depends on a dead
# link looking dead -- alive() going false and channel() returning 0, not the
# last value. A receiver that holds the last frame would present a stale ARM
# as a live one.
moduleData:
  0:
    type: TYPE_CROSSFIRE
    subType: 0
    channelsStart: 0
    channelsCount: 16
    failsafeMode: NOT_SET
    mod:
      crsf:
        telemetryBaudrate: 0
        crsfArmingMode: 0
        crsfArmingTrigger: "NONE"

trainerData:
  mode: OFF
  channelsStart: 0
  channelsCount: -8
  frameLength: 0
  delay: 0
  pulsePol: 0

# Refuse to finish booting unless every switch is in its inert position. This
# is free protection the current stack does not have: today nothing stops you
# powering up the transmitter with ARM already made.
switchWarning:
  SA:
    pos: up
  SB:
    pos: up
  SC:
    pos: up
  SD:
    pos: up
  SE:
    pos: up
  SF:
    pos: up
potsWarnMode: WARN_OFF
potsWarnEnabled: 0

# Throttle warning stays ON: the hip-height stick must be at the retracted end
# before the radio will finish booting. Waking up with the legs commanded out
# is not a state you want to discover by watching it happen.
disableThrottleWarning: 0
enableCustomThrottleWarning: 0
customThrottleWarningPosition: 0
throttleReversed: 0
thrTrim: 0
thrTrimSw: 0
thrTraceSrc: "Thr"
# The bring-up ladder in MODELS/WLRROBOT.txt is shown on model select and has
# to be dismissed deliberately. The radio then refuses to let you skip reading
# it, which is the point.
displayChecklist: 1
checklistInteractive: 0

telemetryProtocol: 0
disableTelemetryWarning: 0
ignoreSensorIds: 0
showInstanceIds: 0
rssiSource: none
rfAlarms:
  warning: 45
  critical: 42
varioData:
  source: 0
  centerSilent: 0
  centerMax: 0
  centerMin: 0
  min: 0
  max: 0

extendedLimits: 0
extendedTrims: 0
displayTrims: 0
trimInc: 0
beepANACenter: 0
noGlobalFunctions: 0
jitterFilter: GLOBAL

# Screen 0: the HUD, full screen, chrome off so the widget owns all 480x320.
# Turn "Top bar" on in Screen settings if you would rather see radio battery
# and timers up there -- the HUD reflows to whatever zone it is given.
# Screen 1: the outputs monitor. This is the screen the CRSF bring-up gate
# needs -- verify every channel lands on its intended function here, torque
# off, before any re-arm.
screenData:
  0:
    LayoutId: "Layout1x1"
    layoutData:
      zones:
        0:
          widgetName: "WLR HUD"
          widgetData:
            options:
              0:
                type: Bool
                value:
                  boolValue: 1
              1:
                type: Color
                value:
                  color: COLIDX4
      options:
        0:
          type: Bool
          value:
            boolValue: 0
        1:
          type: Bool
          value:
            boolValue: 0
        2:
          type: Bool
          value:
            boolValue: 0
        3:
