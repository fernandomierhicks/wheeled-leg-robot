    curve: 0
    name: "PROF"
  9:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "ARM"
  10:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "ESTOP"
  11:
    min: 0
