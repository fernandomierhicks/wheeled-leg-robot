semver: 3.0.0
header:
  name: WLR ROBOT
  bitmap: wlrrobot.png
  labels: "Robot"
  modelId:
    0:
      val: 1

# ---------------------------------------------------------------------------
# Wheeled-leg balancing robot -- channel map per firmware/robot_teensy/
# radio_channels.md and tx15-robot-integration-plan.md section 1.
#
# POLARITY CONVENTION, and read this before touching a switch mix:
#   switch UP   -> -100%  -> ~1000 us -> firmware sees the channel LOW  -> SAFE
#   switch DOWN -> +100%  -> ~2000 us -> firmware sees the channel HIGH -> ACTIVE
# Every two- and three-position function follows it, so "all switches up" is
# always the inert configuration -- which is exactly what the switchWarning
# block below enforces at power-on.
#
# Note that radio_channels.md says things like "C5 up = start recording". That
# "up" means the CHANNEL is high, which on this transmitter is the switch's
# DOWN position. Same signal, opposite word. Do not resolve the clash by
# flipping a mix weight; resolve it by remembering that the firmware talks in
# microseconds and the radio talks in switch positions.
# ---------------------------------------------------------------------------

# Inputs: mode 2. Hip height MUST be the non-centring throttle stick -- leg
# height is a held pose, not a transient, and a self-centring stick would drop
# the legs the moment you let go.
inputNames:
  0:
    val: "Yaw"
  1:
    val: "Vel"
  2:
    val: "Hip"
  3:
    val: "Roll"

expoData:
  - mode: 3
    chn: 0
    srcRaw: "Rud"
    weight: 100
    offset: 0
    swtch: "NONE"
    flightModes: 000000000
    curve:
      type: 1
      value: 0
    scale: 0
    trimSource: 0
    name: "Yaw"
  - mode: 3
    chn: 1
    srcRaw: "Ele"
    weight: 100
    offset: 0
    swtch: "NONE"
    flightModes: 000000000
    curve:
      type: 1
      value: 0
    scale: 0
    trimSource: 0
    name: "Vel"
  # 30% expo on hip height. The useful resolution is in the middle of the
  # travel, where the leg actually does most of its work, and this buys it
  # without touching hip_cmd_rate_lim in firmware. If you want the fine end
  # biased hard toward crouch instead, draw a 5-point curve on the radio
  # (Model -> Curves) and point this expo at it -- that is a 30-second job on
  # the touchscreen and much safer than hand-editing the curve point pool.
  - mode: 3
    chn: 2
    srcRaw: "Thr"
    weight: 100
    offset: 0
    swtch: "NONE"
    flightModes: 000000000
    curve:
      type: 1
      value: 30
    scale: 0
    trimSource: 0
    name: "Hip"
  - mode: 3
    chn: 3
    srcRaw: "Ail"
    weight: 100
    offset: 0
    swtch: "NONE"
    flightModes: 000000000
    curve:
      type: 1
      value: 0
    scale: 0
    trimSource: 0
    name: "Roll"

mixData:
  # CH1 roll setpoint -- right stick H. Self-centring is correct: release
  # returns the body to level.
  - destCh: 0
    srcRaw: "I3"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Roll"
  # CH2 forward velocity -- right stick V. Self-centring = release means stop.
  - destCh: 1
    srcRaw: "I1"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Vel"
  # CH3 hip height -- left stick V, the throttle stick, non-centring.
  - destCh: 2
    srcRaw: "I2"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Hip"
  # CH4 yaw rate -- left stick H, self-centring.
  - destCh: 3
    srcRaw: "I0"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Yaw"
  # CH5 SD log. Down = channel high = start recording.
  - destCh: 4
    srcRaw: "SB"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Log"
  # CH6 jump, rising edge. SE must be the MOMENTARY shoulder switch: the
  # firmware triggers on a rising edge, and a latching switch left up here is
  # a foot-gun you cannot see.
  - destCh: 5
    srcRaw: "SE"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Jump"
  # CH7/CH8 live-tune knobs. The centre detent on these pots gives a
  # repeatable midpoint reference during a pickup sweep.
  - destCh: 6
    srcRaw: "S1"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "TuneA"
  - destCh: 7
    srcRaw: "S2"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "TuneB"
  # CH9 speed profile. Three profiles, three detents: up = 1 (slowest),
  # middle = 2, down = 3 (fastest). Slowest is the up/rest position on purpose.
  - destCh: 8
    srcRaw: "SA"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Prof"
  # CH10 ARM. SF must be the 2-POSITION LATCHING shoulder switch: index-finger
  # reachable for an instant kill, and latching so it holds while you drive.
  # Firmware arms only above 1990 us, so this needs the full +100% travel --
  # verify real endpoints after the CRSF swap, because ELRS sometimes lands a
  # few ticks short and arming then silently stops working.
  - destCh: 9
    srcRaw: "SF"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Arm"
  # CH11 hard ESTOP -- top row, deliberate reach, level triggered. Today a
  # radio-side stop needs the two-stick rescue combo, which is armed only in
  # STANDBY/ESTOP; there is no single-motion panic input while running. This
  # channel is that input, and it is inert until firmware reads it.
  - destCh: 10
    srcRaw: "SC"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Estop"
  # CH12 spare -- earmarked for roll-controller enable (roll_ctrl_en).
  - destCh: 11
    srcRaw: "SD"
    weight: 100
    offset: 0
    swtch: "NONE"
    mltpx: ADD
    carryTrim: 0
    mixWarn: 0
    flightModes: 000000000
    curve:
      type: 0
      value: 0
    delayPrec: 0
    speedPrec: 0
    delayUp: 0
    delayDown: 0
    speedUp: 0
    speedDown: 0
    name: "Spare"

# Channel names only -- travel is left at the full +/-100% default. The
# firmware thresholds are absolute microsecond values (>1990, <1010) and the
# rescue and calibration combos need genuine full deflection, so clamping any
# of CH1-CH4 or CH10 here would quietly break them.
limitData:
  0:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "ROLL"
  1:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "VEL"
  2:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "HIP"
  3:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "YAW"
  4:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "LOG"
  5:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "JUMP"
  6:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "TUNEA"
  7:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
    revert: 0
    curve: 0
    name: "TUNEB"
  8:
    min: 0
    max: 0
    ppmCenter: 0
    offset: 0
    symetrical: 0
